<!doctype html><meta charset="utf-8"><title>Shared observations QA</title><style>body{font:14px/1.7 system-ui;background:#f6f9fa;color:#294d5a;margin:20px}.pass{color:#23744b}.fail{color:#ad4234}button{padding:12px 20px}iframe{display:block;width:100%;height:900px;border:1px solid #cedfe6;margin-top:15px}#responsive{display:flex;gap:20px;flex-wrap:wrap}</style><h1>Actual-source shared observation checks</h1><p>Public CC0 and NOAA source records only. No synthetic measurements.</p><button id="run">Run checks</button><button id="mobile">Run responsive checks</button><ol id="results"></ol><iframe id="app" title="W-ALERTER source QA"></iframe><div id="responsive"></div>
<script type="module">
const results=document.getElementById('results'),frame=document.getElementById('app'),prefix='wa-obs-qa-'+Date.now()+':';let html,mountNo=0;
const wait=async predicate=>{const end=Date.now()+25000;while(Date.now()<end){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,30));}throw Error('UI readiness timeout');};
const log=(name,ok)=>{const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS: ':'FAIL: ')+name;results.append(li);if(!ok)throw Error(name);};
function fill(w,selector,value){const e=w.document.querySelector(selector);if(!e)throw Error('Missing '+selector);if(e.type==='checkbox')e.checked=value;else e.value=value;e.dispatchEvent(new w.Event('change',{bubbles:true}));}
async function mount(target=frame){if(!html)html=await(await fetch('index.html')).text();const id=String(++mountNo),inject=`<base href="${location.origin}/"><script>document.documentElement.dataset.qaMount=${JSON.stringify(id)};const storage=localStorage,prefix=${JSON.stringify(prefix+id+':')};Object.defineProperty(window,'localStorage',{value:{getItem:k=>storage.getItem(prefix+k),setItem:(k,v)=>storage.setItem(prefix+k,v),removeItem:k=>storage.removeItem(prefix+k)}});location.hash='ocean';<\/script>`;target.srcdoc=html.replace('<head>','<head>'+inject);await wait(()=>target.contentDocument?.documentElement?.dataset.qaMount===id&&target.contentWindow.WAScience?.sharedObservationRepository.current&&target.contentDocument.getElementById('timeSelect').options.length===12);return target.contentWindow;}
const panel=d=>d.getElementById('sharedObservationPanel');
const ready=async w=>wait(()=>!panel(w.document).querySelector('[data-shared-observation-filter=speciesId]').disabled);
document.getElementById('run').onclick=async()=>{results.replaceChildren();document.body.dataset.result='running';try{
 const w=await mount(),d=w.document;log('Initial map retains SST with no observation chunk downloads',w.WAScience.sharedObservationRepository.stats.chunkFetches===0&&d.getElementById('oceanPanel').hidden);d.querySelector('.map-command-bar [data-map-panel=observations]').click();await ready(w);log('Default 2025 humpback selection contains all 408 eligible real records',panel(d).querySelectorAll('.observation-summary strong')[1].textContent==='408');log('Only one small year package is fetched on first use',w.WAScience.sharedObservationRepository.stats.chunkFetches===1);log('Species chooser exposes all four supplied taxa',panel(d).querySelector('[data-shared-observation-filter=speciesId]').options.length===4);log('No whole NetCDF, ZIP or CSV source reaches the browser',!w.performance.getEntriesByType('resource').some(r=>/\.(zip|csv|nc)(\?|$)/i.test(r.name)));
 fill(w,'[data-shared-observation-filter=source]','noaa');await ready(w);log('Missing NOAA 2025 data stays empty and never substitutes a historical year',panel(d).querySelectorAll('.observation-summary strong')[1].textContent==='0'&&panel(d).textContent.includes('Başka tarihe otomatik geçilmedi')&&panel(d).querySelector('[data-shared-observation-filter=year]').value==='2025'&&d.getElementById('observationOverlayBadge').hidden);
 fill(w,'[data-shared-observation-filter=source]','all');await ready(w);fill(w,'[data-shared-observation-filter=speciesId]','eubalaena-glacialis');await ready(w);log('Species switch uses the same repository and exact 168 right-whale records for 2025',panel(d).querySelectorAll('.observation-summary strong')[1].textContent==='168');
 fill(w,'[data-shared-observation-filter=source]','noaa');await ready(w);fill(w,'[data-shared-observation-filter=year]','2017');await ready(w);log('Explicit historical NOAA year loads date-only source records',Number(panel(d).querySelectorAll('.observation-summary strong')[1].textContent.replace(/\./g,''))>1000);panel(d).querySelector('.shared-quality-controls').open=true;fill(w,'[data-shared-observation-filter=certainty]','Probable');await ready(w);log('Species identification certainty filters historical source rows without changing GPS uncertainty',Number(panel(d).querySelectorAll('.observation-summary strong')[1].textContent.replace(/\./g,''))>0&&Number(panel(d).querySelectorAll('.observation-summary strong')[1].textContent.replace(/\./g,''))<1550);fill(w,'[data-shared-observation-filter=certainty]','all');await ready(w);panel(d).querySelector('[data-shared-observation-id]').click();log('Record detail preserves date precision, source terms and unknown spatial uncertainty',panel(d).querySelector('.shared-observation-selection').textContent.includes('NOAA public data')&&panel(d).querySelector('.shared-observation-selection').textContent.includes('Belirtilmedi')&&panel(d).querySelector('.shared-observation-selection').textContent.includes('UTC zamanı üretilmedi'));
 panel(d).querySelector('[data-shared-observation-action=context]').click();await wait(()=>panel(d).querySelector('.observation-environment-context'));log('Historical environmental query reports missing periods without using 2025',panel(d).querySelector('.observation-environment-context').textContent.includes('Bu dönemde veri yok')&&!panel(d).querySelector('.observation-environment-context').textContent.includes('2025-'));
 d.querySelector('.map-command-bar [data-map-panel=layers]').click();fill(w,'#timeSelect',d.getElementById('timeSelect').options[2].value);await wait(()=>d.getElementById('mapPeriodSummary').textContent.includes('2025-03'));log('SST month and observation period remain independently labelled',d.getElementById('observationOverlayBadge').textContent.includes('2017')&&!d.getElementById('observationOverlayBadge').textContent.includes('2025-03'));d.querySelector('.map-command-bar [data-map-panel=observations]').click();
 fill(w,'[data-shared-observation-filter=show]',false);log('Observation layer can be hidden without deleting source data',d.getElementById('observationOverlayBadge').hidden&&w.WAScience.sharedObservationRepository.current.recordCount===51594);fill(w,'[data-shared-observation-filter=show]',true);
 panel(d).querySelector('[data-shared-observation-id]').click();
 for(const [language,title]of [['en','Species observations'],['de','Artenbeobachtungen'],['fr','Observations d’espèces'],['es','Observaciones de especies'],['tr','Tür gözlemleri']]){fill(w,'#languageSelect',language);log('New controls and current selection translate in '+language,panel(d).querySelector('h3').textContent===title&&panel(d).querySelector('.shared-observation-selection'));}
 d.querySelector('#localObservationDisclosure>summary').click();log('Previous Happywhale local importer remains available in its own disclosure',!d.getElementById('observationPanel').querySelector('[data-observation-action=import]').disabled&&d.getElementById('localObservationDisclosure').open);d.getElementById('localObservationDisclosure').open=false;
 d.getElementById('closeOceanPanel').click();log('Drawer closes to a clean map with a visible independent historical period badge',d.getElementById('oceanPanel').hidden&&d.getElementById('observationOverlayBadge').textContent.includes('2017'));
 document.body.dataset.result='passed';
 }catch(error){const li=document.createElement('li');li.className='fail';li.textContent=error.stack;results.append(li);document.body.dataset.result='failed';}};
document.getElementById('mobile').onclick=async()=>{try{for(const [width,language]of [[320,'fr'],[390,'de'],[768,'es']]){const target=document.createElement('iframe');target.style.width=width+'px';target.style.flex='0 0 '+width+'px';document.getElementById('responsive').append(target);const w=await mount(target),d=w.document;fill(w,'#languageSelect',language);d.querySelector('.map-command-bar [data-map-panel=observations]').click();await ready(w);log('Observation drawer '+width+' '+language+' has no horizontal overflow',d.documentElement.scrollWidth<=d.documentElement.clientWidth);const b=d.getElementById('oceanPanel').getBoundingClientRect();log('Observation drawer '+width+' '+language+' fits and scrolls',b.left>=0&&b.right<=d.documentElement.clientWidth&&b.height>200);}}catch(error){const li=document.createElement('li');li.className='fail';li.textContent=error.stack;results.append(li);}};
</script>
