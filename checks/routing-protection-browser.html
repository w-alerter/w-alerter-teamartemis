<!doctype html><meta charset="utf-8"><title>Routing and protection QA</title><style>body{font:14px/1.7 system-ui;background:#f5f8fa;color:#23424d;margin:18px}.pass{color:#23744b}.fail{color:#a74935}button{padding:12px 20px;margin-right:12px}iframe{display:block;width:100%;height:900px;border:1px solid #ccdade;margin-top:20px}#responsive{display:flex;gap:18px;flex-wrap:wrap}</style><h1>Actual screenshot regression + protected-area archive QA</h1><p>Isolated test draft. Uses the real source-derived topology and the locally opened area archive. No test data is published.</p><button id="run">Run integration checks</button><button id="mobile">Run responsive checks</button><ol id="results"></ol><iframe id="app" title="Isolated actual W-ALERTER"></iframe><div id="responsive"></div>
<script type="module">
const list=document.getElementById('results'),frame=document.getElementById('app');let html,mountNo=0;const prefix='wa-routing-qa-'+Date.now()+':',fixtures={version:2,routes:[],observations:[],draft:{name:'Screenshot regression · TEST',month:'Kasım',routeId:null,points:[{lat:-69.584,lon:-111.759,klor:1.2},{lat:-67.994,lon:-30.402,klor:1.3}]}};
const wait=async predicate=>{const end=Date.now()+25000;while(Date.now()<end){if(predicate())return;await new Promise(r=>setTimeout(r,30));}throw Error('UI readiness timeout');};
const log=(name,ok)=>{const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS: ':'FAIL: ')+name;list.append(li);if(!ok)throw Error(name);};
function fill(w,selector,value){const e=w.document.querySelector(selector);if(!e)throw Error('Missing '+selector);if(e.type==='checkbox')e.checked=value;else e.value=value;e.dispatchEvent(new w.Event('input',{bubbles:true}));e.dispatchEvent(new w.Event('change',{bubbles:true}));}
async function mount(target=frame){if(!html)html=await(await fetch('index.html')).text();const id=String(++mountNo),inject=`<base href="${location.origin}/"><script>document.documentElement.dataset.qaMount=${JSON.stringify(id)};const storage=localStorage,prefix=${JSON.stringify(prefix+id+':')};Object.defineProperty(window,'localStorage',{value:{getItem:k=>storage.getItem(prefix+k),setItem:(k,v)=>storage.setItem(prefix+k,v),removeItem:k=>storage.removeItem(prefix+k)}});localStorage.setItem('w-alerter.workspace.v2',JSON.stringify(${JSON.stringify(fixtures)}));location.hash='route';<\/script>`;target.srcdoc=html.replace('<head>','<head>'+inject);await wait(()=>target.contentDocument?.documentElement?.dataset.qaMount===id&&target.contentWindow.WAScience&&target.contentWindow.WARouting&&target.contentDocument.getElementById('pointCount').textContent==='2');return target.contentWindow;}
function editFirst(w,lat,lon){w.document.querySelector('[data-point-action=edit][data-index="0"]').click();fill(w,'#stopLat',String(lat));fill(w,'#stopLon',String(lon));w.document.getElementById('addPointButton').click();}
document.getElementById('run').onclick=async()=>{list.replaceChildren();document.body.dataset.result='running';try{const w=await mount(),d=w.document;log('No unchecked straight route is drawn before planning',!w.WALegacy.getPlannedRoute()&&d.querySelectorAll('#routeMap .leaflet-overlay-pane path').length===0);d.getElementById('analyzeRouteButton').click();log('A* runs in a worker and disables duplicate calculation',d.getElementById('analyzeRouteButton').disabled);await wait(()=>d.getElementById('routeTopologyStatus').dataset.state==='found');const r=w.WALegacy.getPlannedRoute();log('Actual screenshot endpoints produce a detour around Antarctica',r.status==='found'&&r.coordinates.length>2&&r.totalNM>2100&&r.totalNM<2200&&r.coordinates.some(c=>c[1]>-63));log('Visible distance uses A* geometry, not direct waypoint distance',d.getElementById('totalNM').textContent.includes('2133.69')&&d.getElementById('riskNM').textContent.includes('1639.62'));log('Map draws one checked ocean route with no risk-coloured straight fallback',d.querySelectorAll('#routeMap .leaflet-overlay-pane path[stroke="#216f78"]').length===1&&d.querySelectorAll('#routeMap .leaflet-overlay-pane path[stroke="#d57865"]').length===0);log('No fabricated biological risk or fuel saving accompanies A*',r.ecologicalRisk===null&&r.fuelSaving===null&&d.querySelector('#routeOutput .output-note').textContent.includes('yakıt tasarrufu hesaplanmadı'));
 const {draftToVoyage}=await import('./fuel/voyageSegments.mjs'),voyage=draftToVoyage(w.WALegacy.getDraft());log('Fuel module receives the complete computed path without ecological clearance',voyage.source.kind==='geometric-astar-reference'&&voyage.segments[0].coordinates.length===r.coordinates.length&&voyage.source.verification==='geometry-only');
 let exported;w.download=(content,type,name)=>exported={content,type,name};d.getElementById('exportJsonButton').click();const json=JSON.parse(exported.content);log('JSON contains exact checked geometry and source hash',json.computedRoute.topologySha256===r.topologySha256&&json.computedRoute.coordinates.length===r.coordinates.length);d.getElementById('exportGpxButton').click();log('GPX contains every calculated track point, not a two-point direct route',(exported.content.match(/<trkpt /g)||[]).length===r.coordinates.length&&exported.content.includes('hydra-geometric-astar-1.0.0'));d.getElementById('exportReportButton').click();log('Report uses the same A* distance and scope',exported.content.includes('2133.69')&&exported.content.includes(r.topologySha256)&&!exported.content.includes('54.3'));
 for(const [lang,label]of [['en','Calculate ocean route'],['de','Ozeanroute berechnen'],['fr','Calculer la route océanique'],['es','Calcular ruta oceánica'],['tr','Deniz rotasını hesapla']]){fill(w,'#languageSelect',lang);log('Routing controls and current result translate in '+lang,d.getElementById('analyzeRouteButton').textContent.includes(label)&&d.getElementById('totalNM').textContent.includes('2133.69'));}
 editFirst(w,-75,0);log('Editing any waypoint clears the old route and output immediately',w.WALegacy.getPlannedRoute()===null&&d.getElementById('routeOutput').hidden&&d.querySelectorAll('#routeMap .leaflet-overlay-pane path').length===0);d.getElementById('analyzeRouteButton').click();await wait(()=>d.getElementById('routeTopologyStatus').dataset.state==='blocked_waypoint');log('Land endpoint gives an explicit error and no fallback line',d.getElementById('routeTopologyStatus').textContent.includes('Otomatik konum değiştirilmedi')&&w.WALegacy.getPlannedRoute()===null&&d.querySelectorAll('#routeMap .leaflet-overlay-pane path').length===0);
 editFirst(w,-69.584,-111.759);d.getElementById('analyzeRouteButton').click();editFirst(w,-69.5,-111.7);await new Promise(resolve=>setTimeout(resolve,800));log('A changed input cancels stale worker completion',w.WALegacy.getPlannedRoute()===null&&d.getElementById('routeTopologyStatus').dataset.state==='idle');
 w.location.hash='ocean';await wait(()=>d.getElementById('datasetSelect').options.length===4&&d.getElementById('timeSelect').options.length===12);d.querySelector('.map-command-bar [data-map-panel=layers]').click();d.querySelector('#layerControls [data-map-panel=protection]').click();await wait(()=>w.WAScience.protectionRepository.current?.metadata.recordCount===37);log('Actual imported archive restores 37 records and 35 sites from IndexedDB',d.getElementById('protectionPanel').textContent.includes('35')&&w.WAScience.protectionRepository.persistence==='indexeddb');log('Protection drawer hides environmental controls and keeps independent release visible',getComputedStyle(d.getElementById('layerControls')).display==='none'&&d.getElementById('protectionPanel').textContent.includes('2026-10'));
 fill(w,'[data-protection-filter=realm]','Marine');log('Marine filter uses 11 source records without reclassifying terrestrial areas',d.querySelectorAll('#protectionPanel .observation-summary strong')[1].textContent==='11');fill(w,'[data-protection-filter=realm]','all');fill(w,'[data-protection-filter=search]','bouvet');log('Search is case-insensitive and retains the point and polygon separately',d.querySelectorAll('.protection-list [data-protection-id]').length===2);d.querySelector('.protection-list [data-protection-id="1125"]').click();log('Point record has no invented radius or boundary',d.querySelector('.protection-selection').textContent.includes('Nokta kaydı · sınır yok'));
 fill(w,'.protection-query [name=latitude]','-54.42653');fill(w,'.protection-query [name=longitude]','3.41492');d.querySelector('.protection-query').requestSubmit();log('Point query preserves point-only relation and the snapshot release',d.querySelector('[data-protection-result]').textContent.includes('Yalnızca nokta kaydıyla eşleşiyor')&&d.querySelector('[data-protection-result]').textContent.includes('2026-10'));fill(w,'.protection-query [name=latitude]','42.5');fill(w,'.protection-query [name=longitude]','-70.2');d.querySelector('.protection-query').requestSubmit();log('Outside subset is never labelled unprotected',d.querySelector('[data-protection-result]').textContent.includes('coğrafi kapsamı dışında'));
 fill(w,'[data-protection-filter=search]','');fill(w,'[data-protection-filter=siteType]','OECM');log('No OECM records are invented from the archive name',d.querySelectorAll('#protectionPanel .observation-summary strong')[1].textContent==='0');fill(w,'[data-protection-filter=siteType]','all');fill(w,'[data-protection-filter=show]',false);log('Layer can be hidden without removing the local archive',d.getElementById('protectionOverlayBadge').hidden&&w.WAScience.protectionRepository.current.metadata.recordCount===37);fill(w,'[data-protection-filter=show]',true);
 d.querySelector('.map-command-bar [data-map-panel=layers]').click();fill(w,'#timeSelect',d.getElementById('timeSelect').options[2].value);await wait(()=>d.getElementById('mapPeriodSummary').textContent.includes('2025-03'));log('Environmental month changes cannot silently date the area snapshot',d.getElementById('protectionOverlayBadge').textContent.includes('2026-10'));d.querySelector('#layerControls [data-map-panel=protection]').click();for(const [lang,label]of [['en','Protected areas'],['de','Schutzgebiete'],['fr','Aires protégées'],['es','Áreas protegidas'],['tr','Korunan alanlar']]){fill(w,'#languageSelect',lang);log('Protected-area controls translate in '+lang,d.getElementById('mapPanelTitle').textContent===label&&d.querySelector('.protection-license').textContent.includes('UNEP-WCMC'));}
 log('No raw scientific or protected-area archive is downloaded by the page',!w.performance.getEntriesByType('resource').some(r=>/\.(nc|zip)(?:\?|$)/i.test(r.name)));d.getElementById('closeOceanPanel').click();log('Closing the drawer restores a clean map',d.getElementById('oceanPanel').hidden);document.body.dataset.result='passed';
 }catch(error){const li=document.createElement('li');li.className='fail';li.textContent=error.stack;list.append(li);document.body.dataset.result='failed';}};
document.getElementById('mobile').onclick=async()=>{try{for(const [width,lang]of [[320,'fr'],[390,'de'],[768,'es']]){const f=document.createElement('iframe');f.style.width=width+'px';f.style.flex='0 0 '+width+'px';document.getElementById('responsive').append(f);const w=await mount(f),d=w.document;fill(w,'#languageSelect',lang);log('Routing layout '+width+' '+lang+' has no horizontal overflow',d.documentElement.scrollWidth<=d.documentElement.clientWidth);w.location.hash='ocean';await wait(()=>d.getElementById('datasetSelect').options.length===4);d.querySelector('.map-command-bar [data-map-panel=layers]').click();d.querySelector('#layerControls [data-map-panel=protection]').click();const box=d.getElementById('oceanPanel').getBoundingClientRect();log('Protected-area drawer '+width+' '+lang+' fits and scrolls',box.left>=0&&box.right<=d.documentElement.clientWidth&&box.height>200&&d.documentElement.scrollWidth<=d.documentElement.clientWidth);}}catch(error){const li=document.createElement('li');li.className='fail';li.textContent=error.stack;list.append(li);}};
</script>
