<!doctype html><html lang="en"><meta charset="utf-8"><title>Fuel engine UI tests — test fixtures only</title>
<style>body{margin:22px;font:14px/1.7 system-ui;background:#edf3f4;color:#15333e}h1{font-size:23px}button{padding:12px 20px;background:#096a64;color:white;border:0;cursor:pointer}iframe{width:100%;height:850px;border:1px solid #a4bbc4;margin-top:20px}li.pass{color:#096a64}li.fail{color:#a33023}.test-label{background:#f8e8cb;padding:13px}#responsive{display:flex;flex-wrap:wrap;gap:20px}#responsive iframe{flex-shrink:0;height:780px}</style>
<h1>Fuel & Carbon Intelligence — UI validation</h1><p class="test-label">TEST FIXTURES ONLY. Artificial numerical fixtures in this test file are not real vessels or HYDRA outputs. Application storage is isolated behind a temporary test prefix, and cleaned at the end.</p><button id="run">Run lifecycle checks</button> <button id="mobile">Render responsive checks</button><ol id="results"></ol><div id="responsive"></div><iframe id="app" title="Isolated test application"></iframe>
<script type="module">
const frame=document.getElementById('app'),results=document.getElementById('results'),prefix='wa-fuel-ui-test-'+Date.now()+':';let html,mountCount=0;
const log=(name,ok,info='')=>{const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS: ':'FAIL: ')+name+(info?' — '+info:'');results.append(li);if(!ok)throw Error(name+' '+info);};
const wait=async fn=>{const end=Date.now()+12000;while(Date.now()<end){if(fn())return;await new Promise(r=>setTimeout(r,25));}throw Error('Timed out waiting for test state');};
async function source(){if(!html)html=await (await fetch('index.html')).text();return html;}
async function mount(target=frame,hash='fuel',lang='tr'){
 const marker=String(++mountCount),original=await source(),injected=`<base href="${location.origin}/"><script>document.documentElement.dataset.qaMount=${JSON.stringify(marker)};const nativeStore=window.localStorage,prefix=${JSON.stringify(prefix)};Object.defineProperty(window,'localStorage',{value:{getItem:k=>nativeStore.getItem(prefix+k),setItem:(k,v)=>nativeStore.setItem(prefix+k,v),removeItem:k=>nativeStore.removeItem(prefix+k)}});location.hash=${JSON.stringify(hash)};<\/script>`;
 target.srcdoc=original.replace('<head>','<head>'+injected);await wait(()=>target.contentDocument?.documentElement.dataset.qaMount===marker&&target.contentWindow?.WAFuel&&target.contentWindow?.WAScience);if(lang!=='tr'){const select=target.contentDocument.getElementById('languageSelect');select.value=lang;select.dispatchEvent(new target.contentWindow.Event('change',{bubbles:true}));}return target.contentWindow;
}
const field=(w,id,value)=>{const el=w.document.getElementById(id);if(!el)throw Error('Missing '+id);el.value=value;el.dispatchEvent(new w.Event('input',{bubbles:true}));el.dispatchEvent(new w.Event('change',{bubbles:true}));};
const click=(w,selector)=>{const el=w.document.querySelector(selector);if(!el)throw Error('Missing '+selector);el.click();};
const depart='2026-10-25T00:00:00.000Z';
const actualTestRoute=(role,speed)=>({format:'w-alerter-voyage',version:1,route:{id:'TEST-ONLY-'+role,name:'TEST ONLY — NOT A REAL VOYAGE',role,departureIso:depart,source:{kind:role==='reference'?'user-verified-reference':'hydra-import',verification:'user-attested',citation:'TEST FIXTURE ONLY — NOT A REAL HYDRA ENGINE',engineVersion:'TEST ONLY'},segments:[{coordinates:[[0,0],[1,0]],speedKnots:speed}]}});
async function importFixture(w,role,speed){click(w,`[data-fuel-action="import-${role}"]`);field(w,'fc-import-text',JSON.stringify(actualTestRoute(role,speed)));const form=w.document.getElementById('fc-import-form');form.elements.attested.checked=true;form.requestSubmit();await wait(()=>w.WAFuel.current()[role]?.status==='computed');}
document.getElementById('run').onclick=async()=>{
 results.replaceChildren();try{
 let w=await mount();log('Application starts without seeded vessel/results',w.WAFuel.repository.list().length===0&&w.WAFuel.current().reference===null);
 for(const [id,value]of Object.entries({'fc-name':'TEST FIXTURE ONLY','fc-vesselType':'cargo','fc-engineType':'medium-speed-diesel','fc-nominalPowerKw':'1000','fc-referenceSpeedKnots':'10','fc-referenceLoad':'80','fc-fuelId':'diesel','fc-sfocGPerKwh':'200','fc-sfocReferenceLoad':'80','fc-plannedSpeedKnots':'10','fc-maxSpeedKnots':'14','fc-price':'500','fc-priceDate':'2026-10-25'}))field(w,id,value);
 field(w,'languageSelect','de');log('Changing language preserves unsaved technical inputs',w.document.getElementById('fc-name').value==='TEST FIXTURE ONLY'&&w.document.getElementById('fc-nominalPowerKw').value==='1000');field(w,'languageSelect','tr');
 w.document.querySelector('[name="displacementModelConfirmed"]').checked=true;
 w.document.getElementById('fc-profile-form').requestSubmit();await wait(()=>w.WAFuel.repository.list().length===1);log('Real profile form saves v1 and parses percent as fraction',w.WAFuel.repository.selected().referenceLoad===.8&&w.WAFuel.repository.selected().version===1);
 field(w,'fc-departure','2026-10-25T00:00');w.location.hash='route';await wait(()=>w.document.body.dataset.page==='route');
 for(const lon of ['0','1']){field(w,'stopLat','0');field(w,'stopLon',lon);field(w,'stopChlo','.1');w.document.getElementById('routeForm').requestSubmit();}
 w.location.hash='fuel';await wait(()=>w.document.body.dataset.page==='fuel'&&w.WAFuel.current().reference?.status==='computed');
 log('Waypoint planner feeds segment/time/fuel engine',w.WAFuel.current().reference.totals.fuelKg>0&&w.WAFuel.current().reference.segments.length===1);
 log('Price form reaches the independent economic engine',Math.abs(w.WAFuel.current().reference.cost.amount-w.WAFuel.current().reference.totals.fuelKg*.5)<1e-8);
 log('Unverified draft has no invented comparison',w.WAFuel.current().comparison.status==='blocked'&&w.WAFuel.current().reference.segments[0].auxiliaryFuelKg===null);
 const oldFuel=w.WAFuel.current().reference.totals.fuelKg;field(w,'fc-preferred','8');await wait(()=>w.WAFuel.current().reference?.status==='computed');log('Changing preferred speed recalculates consumption',w.WAFuel.current().reference.totals.fuelKg<oldFuel);
 field(w,'fc-preferred','0');log('Stale result disappears immediately on invalid speed',w.WAFuel.current().reference===null||w.WAFuel.current().reference.status==='blocked');await wait(()=>w.WAFuel.current().reference?.status==='blocked');
 field(w,'fc-preferred','10');await wait(()=>w.WAFuel.current().reference?.status==='computed');
 await importFixture(w,'reference',8);await importFixture(w,'hydra',10);await wait(()=>w.WAFuel.current().comparison.status==='computed');
 log('Documented test imports exercise comparison through actual UI',w.WAFuel.current().comparison.fuel.saving<0&&w.WAFuel.current().comparison.co2.percent>0);
 const {ROUTING_FACTORS}=await import('./science/catalog.mjs');for(const f of ROUTING_FACTORS)w.WAScience.routingEngines.registerCostTerm({id:f.id,version:'TEST ONLY',citation:'TEST ONLY',validationReference:'TEST ONLY',units:'TEST ONLY',evaluate:()=>1});w.WAScience.routingEngines.register({id:'hydra',version:'TEST ONLY',provenance:'TEST FIXTURE ONLY',plan:()=>Promise.resolve(actualTestRoute('hydra',10).route)});await w.WAScience.routingEngines.plan('hydra',{scientificReviewApproved:true,departureIso:depart});await wait(()=>w.WAFuel.current().hydra?.route.source.kind==='hydra-engine'&&w.WAFuel.current().comparison.status==='computed');log('Registered routing output reaches the fuel engine automatically',w.WAFuel.current().hydra.route.source.engineVersion==='TEST ONLY');
 log('Extra consumption is labelled as extra, not savings',w.document.getElementById('fc-results').textContent.includes('Ek yakıt (kg)'));
 click(w,'[data-fuel-action="save-result"]');const first=w.WAFuel.repository.snapshot().calculations[0];log('Saved result retains full v1 profile/route input snapshots',first.reference.profileVersion===1&&first.reference.provenance.inputs.profile.nominalPowerKw===1000);
 click(w,'[data-fuel-pane="profiles"]');click(w,'[data-fuel-action="edit-profile"]');field(w,'fc-nominalPowerKw','2000');log('Unsaved profile edits clear previous results',w.WAFuel.current().reference===null&&w.WAFuel.current().reason==='unsaved_profile');w.document.getElementById('fc-profile-form').requestSubmit();await wait(()=>w.WAFuel.current().reference?.profileVersion===2);
 log('Editing a profile recalculates new revision without changing history',w.WAFuel.repository.selected().version===2&&w.WAFuel.repository.snapshot().calculations[0].reference.profileVersion===1);
 w=await mount();await wait(()=>w.WAFuel.current().reference?.status==='computed');log('Profiles/settings/imported routes/calculations survive reload',w.WAFuel.repository.selected().version===2&&w.WAFuel.repository.snapshot().calculations.length===1&&w.WAFuel.current().comparison.status==='computed');
 for(const [lang,title]of [['en','Fuel & carbon'],['de','Kraftstoff & CO₂'],['fr','Carburant & CO₂'],['es','Combustible y CO₂'],['tr','Yakıt & karbon']]){field(w,'languageSelect',lang);log('Localized module '+lang,w.document.querySelector('#page-fuel h1').textContent===title&&w.document.querySelector('.brand-name').textContent==='W-ALERTER');}
 click(w,'[data-fuel-pane="profiles"]');click(w,'[data-fuel-action="delete-profile"]');log('Deleting profile preserves historical calculation',w.WAFuel.repository.list().length===0&&w.WAFuel.repository.snapshot().calculations.length===1);click(w,'[data-fuel-action="undo-delete"]');log('Profile deletion can be undone',w.WAFuel.repository.list().length===1&&w.document.querySelectorAll('[data-fuel-select]').length===1);
 log('Original NASA references preserved',JSON.stringify(w.WALegacy.references)===JSON.stringify({Ekim:.4091,Kasım:.3253,Aralık:.3481,Ocak:.3303}));
 document.body.dataset.result='passed';
 }catch(e){document.body.dataset.result='failed';const li=document.createElement('li');li.className='fail';li.textContent='ERROR: '+e.stack;results.append(li);}finally{for(const key of Object.keys(localStorage))if(key.startsWith(prefix))localStorage.removeItem(key);}
};
document.getElementById('mobile').onclick=async()=>{
 const area=document.getElementById('responsive');area.replaceChildren();for(const [width,lang]of [[320,'fr'],[390,'de'],[768,'es']]){const f=document.createElement('iframe');f.title='Responsive '+width+' '+lang;f.style.width=width+'px';f.style.flex='0 0 '+width+'px';area.append(f);const w=await mount(f,'fuel',lang);const body=w.document.body;log('Responsive '+width+' '+lang,w.document.documentElement.scrollWidth<=w.document.documentElement.clientWidth);}
};
</script></html>
