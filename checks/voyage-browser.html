<!doctype html><html lang="en"><meta charset="utf-8"><title>W-ALERTER source-aware voyage QA</title><style>body{font:14px/1.7 system-ui;margin:20px;background:#edf3f4;color:#183e4c}button{padding:12px 20px;background:#087f76;border:0;color:white}iframe{width:100%;height:1000px;border:1px solid #b6c8cd}.pass{color:#087f76}.fail{color:#a34334}#responsive{display:flex;flex-wrap:wrap;gap:10px}#responsive iframe{height:700px;flex-shrink:0}</style><h1>Voyage / AIS integration checks</h1><p>TEST ONLY. Synthetic vessel inputs and test measurements. Real ocean/current/AIS cells and checked A* geometry. Isolated disposable browser storage.</p><button id="run">Run integration checks</button><ol id="results"></ol><div id="responsive"></div><iframe id="app" title="Isolated W-ALERTER test application"></iframe><script type="module">
const frame=document.getElementById('app'),results=document.getElementById('results'),prefix='wa-master-qa-'+Date.now()+':';let html,count=0;
const log=(name,ok,info='')=>{const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS: ':'FAIL: ')+name+(info?' — '+info:'');results.append(li);if(!ok)throw Error(name+' '+info);};
const wait=async(fn,ms=30000)=>{const end=Date.now()+ms;while(Date.now()<end){if(fn())return;await new Promise(r=>setTimeout(r,30));}throw Error('Timed out waiting for test state');};
async function mount(target=frame,hash='fuel',lang='tr'){if(!html)html=await(await fetch('index.html')).text();const marker=String(++count),injection=`<base href="${location.origin}/"><script>document.documentElement.dataset.qaMount=${JSON.stringify(marker)};const nativeStore=window.localStorage,prefix=${JSON.stringify(prefix)};Object.defineProperty(window,'localStorage',{value:{getItem:k=>nativeStore.getItem(prefix+k),setItem:(k,v)=>nativeStore.setItem(prefix+k,v),removeItem:k=>nativeStore.removeItem(prefix+k)}});location.hash=${JSON.stringify(hash)};<\/script>`;target.srcdoc=html.replace('<head>','<head>'+injection);await wait(()=>target.contentDocument?.documentElement.dataset.qaMount===marker&&target.contentWindow?.WAVoyage);const w=target.contentWindow;if(lang!=='tr')field(w,'languageSelect',lang);return w;}
const field=(w,id,value)=>{const e=w.document.getElementById(id);if(!e)throw Error('Missing '+id);e.value=value;e.dispatchEvent(new w.Event('input',{bubbles:true}));e.dispatchEvent(new w.Event('change',{bubbles:true}));},click=(w,sel)=>{const e=w.document.querySelector(sel);if(!e)throw Error('Missing '+sel);e.click();},page=async(w,p)=>{w.location.hash=p;await wait(()=>w.document.body.dataset.page===p);};
document.getElementById('run').onclick=async()=>{results.replaceChildren();try{const w=await mount();log('No seeded profiles or fabricated results',w.WAFuel.repository.list().length===0&&w.WAVoyage.current().status==='empty');
for(const [id,val]of Object.entries({'fc-name':'TEST FIXTURE ONLY — NOT A REAL VESSEL','fc-vesselType':'bulk','fc-engineType':'medium-speed-diesel','fc-nominalPowerKw':'1000','fc-referenceSpeedKnots':'10','fc-referenceLoad':'80','fc-fuelId':'diesel','fc-sfocGPerKwh':'200','fc-sfocReferenceLoad':'80','fc-plannedSpeedKnots':'10','fc-maxSpeedKnots':'14','fc-minimumSpeedKnots':'5','fc-lengthMeters':'211','fc-noiseClass':'Bulker','fc-price':'500','fc-priceDate':'2025-03-01'}))field(w,id,val);w.document.querySelector('[name=displacementModelConfirmed]').checked=true;w.document.querySelector('[name=noiseAcknowledged]').checked=true;w.document.getElementById('fc-profile-form').requestSubmit();await wait(()=>w.WAFuel.repository.list().length===1);log('Optional operating/acoustic fields persist with versioned profile',w.WAFuel.repository.selected().lengthMeters===211&&w.WAFuel.repository.selected().noise.scenarioAcknowledged);
await page(w,'route');for(const [lon,lat]of [[-70,42.5],[-69,43]]){field(w,'stopLat',lat);field(w,'stopLon',lon);field(w,'stopChlo','.1');w.document.getElementById('routeForm').requestSubmit();}click(w,'#analyzeRouteButton');await wait(()=>w.WALegacy.getPlannedRoute()?.status==='found');const baseline=w.WALegacy.getPlannedRoute();log('Real A* result feeds new study with unchanged mandatory endpoints',baseline.neighbours===16&&baseline.inputWaypoints[0][0]===-70&&baseline.inputWaypoints.at(-1)[0]===-69);
await page(w,'voyage');log('Selected vessel populates declared operating speed',w.document.getElementById('vs-speed').value==='10');field(w,'vs-departure','2025-03-01T00:00');field(w,'vs-altSpeed','9');field(w,'vs-mode','emissions');field(w,'vs-dailyRate','480');w.document.querySelector('[name=rateAck]').checked=true;field(w,'vs-voyages','20');field(w,'vs-fleet','2');click(w,'#voyage-submit');await wait(()=>w.WAVoyage.current().status==='complete',120000);let s=w.WAVoyage.current(),complete=s.results.filter(r=>r.status==='computed');log('Checked candidate corridors and declared speed scenarios complete',complete.length>=4,JSON.stringify(s.results.map(r=>({id:r.id,status:r.status,reason:r.reason}))));log('Actual monthly source dates retained and STW differs from current-corrected SOG',complete.every(r=>r.segments.every(a=>a.current.calendarPeriod==='2025-03'))&&complete.some(r=>Math.abs(r.totals.stwKnots-r.totals.meanSogKnots)>.0001));log('Reference-matched source noise is scenario-only; no animal effects',complete.every(r=>r.noise.status==='scenario'&&r.noise.animalEffects===null&&r.noise.receivedNoise===null));log('No fabricated habitat/collision probability',complete.every(r=>r.habitat.value===null&&r.collision.value===null));log('Ranking and comparison use declared economics and annual basis',s.ranking.status==='ranked'&&Object.values(s.comparisons).some(c=>c.status==='compared'&&c.annual.status==='projected'));
log('Real candidate geometry, metrics and source sections render',w.document.querySelectorAll('#voyage-map path.leaflet-interactive').length>=3&&w.document.querySelectorAll('.voyage-metric').length>=8);let exported;const native=w.URL.createObjectURL;w.URL.createObjectURL=blob=>{exported=blob;return native(blob);};click(w,'[data-voyage-action=export]');await wait(()=>exported);const report=JSON.parse(await exported.text());log('JSON export preserves calculation hash, input versions and no navigation certification',report.results.every(r=>r.status!=='computed'||r.provenance.inputSha256&&r.profileVersion===1&&r.navigationCleared===false));
for(const [lang,title]of [['tr','Sefer karşılaştırması'],['en','Voyage comparison'],['de','Reisevergleich'],['fr','Comparaison de voyage'],['es','Comparación del viaje']]){field(w,'languageSelect',lang);log('Voyage UI and unsaved inputs preserve language '+lang,w.document.querySelector('#page-voyage h1').textContent===title&&w.document.getElementById('vs-departure').value==='2025-03-01T00:00'&&w.document.getElementById('vs-altSpeed').value==='9');}
field(w,'languageSelect','en');field(w,'vs-speed','10.1');log('Editing an input immediately removes stale metrics and map',w.WAVoyage.current().status==='empty'&&!w.document.getElementById('voyage-map'));
field(w,'vs-altSpeed','');w.document.querySelector('[name=alternatives]').checked=false;field(w,'vs-departure','2026-03-01T00:00');click(w,'#voyage-submit');await wait(()=>w.WAVoyage.current().status==='complete');s=w.WAVoyage.current();log('Missing2026 current explicitly blocks without zero/2025 substitution',s.results[0].status==='blocked'&&s.results[0].reason==='current_coverage_incomplete'&&s.results[0].totals===null&&w.document.getElementById('voyage-results').textContent.includes('No current data'));
field(w,'vs-departure','2025-03-01T00:00');field(w,'vs-mode','wildlife');click(w,'#voyage-submit');await wait(()=>w.WAVoyage.current().status==='complete');s=w.WAVoyage.current();log('Wildlife optimization is gated without fitted independent model',s.results[0].status==='computed'&&s.ranking.status==='blocked'&&s.ranking.reason==='reviewed_species_habitat_model_missing');
await page(w,'ocean');click(w,'[data-map-panel=layers]');const search=w.document.getElementById('geographicSearchForm');search.elements.latitude.value='42.5';search.elements.longitude.value='-70.2';search.requestSubmit();log('Coordinate search accepts explicit geographic input',w.document.getElementById('geographicSearchStatus').textContent==='42.50000 / -70.20000');click(w,'[data-map-panel=traffic]');await wait(()=>w.document.querySelector('#trafficPanel form'));const q=w.document.querySelector('#trafficPanel form');q.elements.latitude.value='42.36178701646538';q.elements.longitude.value='-71.04523817924151';q.requestSubmit();await wait(()=>w.document.querySelector('.traffic-value')?.textContent==='30,956');log('AIS UI matches actual native Boston cell30956 with explicit annual2025',w.document.querySelector('#trafficPanel').textContent.includes('2025')&&w.document.querySelector('.traffic-value').textContent==='30,956');const ais=await w.WAScience.getEnvironmentalValue('ais_transits',42.36178701646538,-71.04523817924151,'2025-03-01',{temporalMode:'annual-background'});log('AIS is accessible through the common environmental service',ais.value===30956&&ais.uncertainty.value===null);
for(const [width,lang]of [[320,'de'],[390,'fr'],[768,'es']]){const iframe=document.createElement('iframe');iframe.style.width=width+'px';document.getElementById('responsive').append(iframe);const rw=await mount(iframe,'voyage',lang);await new Promise(r=>setTimeout(r,100));log('Responsive study has no document overflow '+width+'px',rw.document.documentElement.scrollWidth<=rw.innerWidth+1);rw.location.hash='ocean';await wait(()=>rw.document.body.dataset.page==='ocean');click(rw,'[data-map-panel=layers]');click(rw,'[data-map-panel=traffic]');log('Responsive AIS drawer fits '+width+'px',rw.document.documentElement.scrollWidth<=rw.innerWidth+1);}
await page(w,'voyage');field(w,'languageSelect','tr');field(w,'vs-mode','emissions');field(w,'vs-altSpeed','9');w.document.querySelector('[name=alternatives]').checked=true;click(w,'#voyage-submit');await wait(()=>w.WAVoyage.current().status==='complete');log('Final detailed comparison remains usable after repeated page/language changes',w.WAVoyage.current().ranking.status==='ranked');for(const key of Object.keys(localStorage))if(key.startsWith(prefix))localStorage.removeItem(key);document.documentElement.dataset.result='pass';}catch(e){const li=document.createElement('li');li.className='fail';li.textContent='FAIL: '+e.stack;results.append(li);document.documentElement.dataset.result='fail';}};
</script>
