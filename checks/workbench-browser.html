<!doctype html><meta charset="utf-8"><title>Actual-source workbench checks</title><style>body{font:14px/1.7 system-ui;background:#f5f7f9;color:#223f4d;margin:20px}button{padding:12px 18px;background:#226672;color:white;border:0;border-radius:8px;margin-right:10px;cursor:pointer}.pass{color:#1b786b}.fail{color:#a44e3a}iframe{border:1px solid #c8d6dd;width:100%;height:850px}#mobile{display:flex;flex-wrap:wrap;gap:20px}</style>
<h1>W-ALERTER — actual-source workbench checks</h1><button id="run">Run source and UI checks</button><button id="responsive">Check responsive layouts</button><ol id="results"></ol><iframe id="app" title="Actual W-ALERTER"></iframe><div id="mobile"></div>
<script type="module">
const results=document.getElementById('results'),frame=document.getElementById('app');let html,mountId=0;const prefix='wa-workbench-qa-'+Date.now()+':';
const wait=async f=>{const deadline=Date.now()+22000;while(Date.now()<deadline){if(f())return;await new Promise(r=>setTimeout(r,25));}throw Error('UI did not become ready');};
const log=(name,passed)=>{const li=document.createElement('li');li.className=passed?'pass':'fail';li.textContent=(passed?'PASS: ':'FAIL: ')+name;results.append(li);if(!passed)throw Error(name);};
const fill=(w,selector,value)=>{const e=w.document.querySelector(selector);if(!e)throw Error('Missing '+selector);if(e.type==='checkbox')e.checked=value;else e.value=value;e.dispatchEvent(new w.Event('input',{bubbles:true}));e.dispatchEvent(new w.Event('change',{bubbles:true}));};
async function mount(target=frame,lang='tr'){if(!html)html=await(await fetch('index.html')).text();const id=String(++mountId),inject=`<base href="${location.origin}/"><script>document.documentElement.dataset.qaMount=${JSON.stringify(id)};const storage=localStorage,prefix=${JSON.stringify(prefix)};Object.defineProperty(window,'localStorage',{value:{getItem:k=>storage.getItem(prefix+k),setItem:(k,v)=>storage.setItem(prefix+k,v),removeItem:k=>storage.removeItem(prefix+k)}});location.hash='ocean';<\/script>`;target.srcdoc=html.replace('<head>','<head>'+inject);await wait(()=>target.contentDocument?.documentElement?.dataset.qaMount===id&&target.contentDocument.querySelectorAll('#datasetSelect option').length===4&&target.contentDocument.querySelectorAll('#timeSelect option').length===12);const w=target.contentWindow;if(lang!=='tr')fill(w,'#languageSelect',lang);return w;}
const query=async(w,s,date=s.time.slice(0,10),mode='exact')=>{w.document.querySelector('.map-command-bar [data-map-panel="query"]').click();for(const [key,value]of Object.entries({latitude:s.requestedLatitude,longitude:s.requestedLongitude,date,temporalMode:mode}))fill(w,'.environment-query [name="'+key+'"]',String(value));w.document.querySelector('.environment-query').requestSubmit();await wait(()=>w.document.querySelector('.environment-point-result dd'));return w.document.querySelector('.environment-point-result').textContent;};
document.getElementById('run').onclick=async()=>{results.replaceChildren();try{const w=await mount();log('Details are closed initially; all three map tools are present',w.document.getElementById('oceanPanel').hidden&&w.document.querySelectorAll('.map-command-bar button').length===3);w.document.querySelector('.map-command-bar [data-map-panel="layers"]').click();log('Layer drawer opens with accessible state',!w.document.getElementById('oceanPanel').hidden&&w.document.querySelector('[data-map-panel="layers"]').getAttribute('aria-expanded')==='true');
 const catalog=await(await fetch('data/environment/catalog.json')).json();for(const e of catalog.datasets.filter(d=>d.kind==='currents')){const url=new URL(e.manifest,new URL('data/environment/catalog.json',location.href)),m=await(await fetch(url)).json(),samples=await(await fetch(new URL('validation-samples.json',url))).json();fill(w,'#datasetSelect',e.id);for(const s of m.timeSlices){fill(w,'#timeSelect',s.time);await wait(()=>w.document.getElementById('layerStatus').textContent.endsWith(s.period)&&Number(w.document.querySelector('.environmental-vector-layer')?.dataset.arrowCount)>0);const p=samples.find(p=>p.timeId===s.id),text=await query(w,p),expected=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:3}).format(p.speed);log(e.id+' '+s.period+' source value and true source time',p.speed==null?text.includes('Veri yok'):text.includes(expected+' m/s')&&text.includes(s.time)&&text.includes(s.source.originalFile));}}
 fill(w,'#datasetSelect','cmems-currents-2025-north-atlantic');fill(w,'#timeSelect','2025-03-01T00:00:00Z');await wait(()=>w.document.getElementById('layerStatus').textContent.endsWith('2025-03'));const sample={requestedLatitude:42.5,requestedLongitude:-70.2,time:'2025-03-01T00:00:00Z'};let text=await query(w,sample,'2025-03-16');log('A missing exact date never receives a substituted value',text.includes('Bu tarihte kaynak kaydı yok.')&&!text.includes(' m/s'));text=await query(w,sample,'2025-03-16','calendar-month');log('Explicit month mean retains missing time bounds and uncertainty',text.includes('2025-03-01T00:00:00Z')&&text.includes('Dosyada kodlanmamış')&&text.includes('Sağlayıcı tarafından verilmemiş'));text=await query(w,{...sample,requestedLatitude:30,requestedLongitude:0},'2025-03-16','calendar-month');log('Outside source cannot clamp to the nearest ocean cell',text.includes('Bu konum seçilen kaynak bölgesinin dışında'));
 for(const v of ['current_u','current_v','current_speed']){fill(w,'#variableSelect',v);await wait(()=>w.document.getElementById('layerStatus').textContent.endsWith('2025-03')&&w.document.querySelectorAll('.environmental-raster-layer canvas').length);log('Current display variable '+v,w.document.getElementById('mapLayerSummary').textContent.includes('m/s'));}
 fill(w,'#showCurrentVectors',false);await wait(()=>!w.document.querySelector('.environmental-vector-layer')&&w.document.querySelectorAll('.environmental-raster-layer canvas').length>0&&w.document.getElementById('layerStatus').textContent.endsWith('2025-03'));log('Direction arrows can be hidden without changing native data',w.document.querySelectorAll('.environmental-raster-layer canvas').length>0);fill(w,'#showCurrentVectors',true);await wait(()=>Number(w.document.querySelector('.environmental-vector-layer')?.dataset.arrowCount)>0);
 w.document.getElementById('closeOceanPanel').click();log('Close drawer restores the map',w.document.getElementById('oceanPanel').hidden);w.document.getElementById('nextSourceMonth').click();await wait(()=>w.document.getElementById('layerStatus').textContent.endsWith('2025-04'));log('Compact month navigation makes the selected period explicit',w.document.getElementById('mapPeriodSummary').textContent.includes('2025-04'));
 for(const [lang,label]of [['en','Layers'],['de','Ebenen'],['fr','Couches'],['es','Capas'],['tr','Katmanlar']]){fill(w,'#languageSelect',lang);await wait(()=>w.document.querySelector('.map-command-bar [data-map-panel="layers"] span').textContent===label);log('Complete workbench controls in '+lang,w.document.getElementById('datasetSelect').options.length===4);}
 log('No raw NetCDF or whale archive is fetched',!w.performance.getEntriesByType('resource').some(r=>/\.(nc|zip)(?:\?|$)/i.test(r.name)));w.document.querySelector('.map-command-bar [data-map-panel="observations"]').click();await wait(()=>w.document.getElementById('observationPanel').textContent.includes('Dosya bu tarayıcıda işlenir.'));log('Research import is explicit and keeps the noncommercial notice',w.document.getElementById('observationPanel').textContent.includes('fotoğraf lisansıdır'));
 document.body.dataset.result='passed';}catch(e){const li=document.createElement('li');li.className='fail';li.textContent=e.stack;results.append(li);document.body.dataset.result='failed';}};
document.getElementById('responsive').onclick=async()=>{try{const area=document.getElementById('mobile');area.replaceChildren();for(const [width,lang]of [[320,'fr'],[390,'de'],[768,'es']]){const f=document.createElement('iframe');f.style.width=width+'px';f.style.flex='0 0 '+width+'px';f.title=width+' '+lang;area.append(f);const w=await mount(f,lang);w.document.querySelector('.map-command-bar [data-map-panel="layers"]').click();const panel=w.document.getElementById('oceanPanel').getBoundingClientRect();log('Viewport '+width+' '+lang+': drawer fits, every control remains accessible',w.document.documentElement.scrollWidth<=w.document.documentElement.clientWidth&&panel.left>=0&&panel.right<=w.document.documentElement.clientWidth&&panel.height>200);}}catch(e){const li=document.createElement('li');li.className='fail';li.textContent=e.stack;results.append(li);}};
</script>
