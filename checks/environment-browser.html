<!doctype html><html lang="en"><meta charset="utf-8"><title>Actual-source SST browser checks</title><style>body{font:14px/1.7 system-ui;background:#eff4f5;color:#163440;margin:22px}h1{font-size:24px}button{padding:11px 18px;background:#096a64;border:0;color:white;cursor:pointer;margin-right:12px}li.pass{color:#096a64}li.fail{color:#a23c2a}iframe{width:100%;height:820px;border:1px solid #acc4cb;margin-top:20px}#responsive{display:flex;flex-wrap:wrap;gap:20px}#responsive iframe{flex-shrink:0}</style>
<h1>2025 SST — actual-source UI checks</h1><p>All scientific test values below are read from the real source-cell verification records, not generated observations. The iframe uses isolated local preferences.</p><button id="run">Run actual-source UI checks</button><button id="mobile">Check responsive layouts</button><ol id="results"></ol><div id="responsive"></div><iframe id="app" title="Actual-source SST application"></iframe>
<script type="module">
const frame=document.getElementById('app'),results=document.getElementById('results'),prefix='wa-sst-qa-'+Date.now()+':';let html,mountCount=0;
const wait=async f=>{const deadline=Date.now()+18000;while(Date.now()<deadline){if(f())return;await new Promise(r=>setTimeout(r,30));}throw Error('UI state did not become ready');};
const log=(name,pass)=>{const li=document.createElement('li');li.className=pass?'pass':'fail';li.textContent=(pass?'PASS: ':'FAIL: ')+name;results.append(li);if(!pass)throw Error(name);};
const fill=(w,selector,value)=>{const el=w.document.querySelector(selector);if(!el)throw Error('Missing control '+selector);el.value=value;el.dispatchEvent(new w.Event('input',{bubbles:true}));el.dispatchEvent(new w.Event('change',{bubbles:true}));};
async function mount(target=frame,lang='tr'){
 if(!html)html=await(await fetch('index.html')).text();const marker=String(++mountCount),inject=`<base href="${location.origin}/"><script>document.documentElement.dataset.qaMount=${JSON.stringify(marker)};const nativeStore=window.localStorage,prefix=${JSON.stringify(prefix)};Object.defineProperty(window,'localStorage',{value:{getItem:k=>nativeStore.getItem(prefix+k),setItem:(k,v)=>nativeStore.setItem(prefix+k,v),removeItem:k=>nativeStore.removeItem(prefix+k)}});location.hash='ocean';<\/script>`;
 target.srcdoc=html.replace('<head>','<head>'+inject);await wait(()=>target.contentDocument?.documentElement?.dataset.qaMount===marker&&target.contentDocument.querySelectorAll('#timeSelect option').length===12&&target.contentDocument.querySelector('.environment-inspector')?.textContent.includes('0.25')||target.contentDocument?.documentElement?.dataset.qaMount===marker&&target.contentDocument.querySelectorAll('#timeSelect option').length===12&&target.contentDocument.querySelector('.environment-query'));
 const w=target.contentWindow;if(lang!=='tr')fill(w,'#languageSelect',lang);return w;
}
const query=async(w,{latitude,longitude,date,mode='exact'})=>{fill(w,'.environment-query [name="latitude"]',String(latitude));fill(w,'.environment-query [name="longitude"]',String(longitude));fill(w,'.environment-query [name="date"]',date);fill(w,'.environment-query [name="temporalMode"]',mode);w.document.querySelector('.environment-query').requestSubmit();await wait(()=>w.document.querySelector('.environment-point-result dd')||w.document.querySelector('.environment-query-warning'));return w.document.querySelector('.environment-point-result').textContent;};
const cleanup=()=>{for(const key of Object.keys(localStorage))if(key.startsWith(prefix))localStorage.removeItem(key);};
document.getElementById('run').onclick=async()=>{results.replaceChildren();try{
 const w=await mount(),catalog=await(await fetch('data/environment/catalog.json')).json(),base=new URL(catalog.datasets[0].manifest,new URL('data/environment/catalog.json',location.href)),manifest=await(await fetch(base)).json(),samples=await(await fetch(new URL('validation-samples.json',base))).json();
 log('Twelve actual source periods are selectable',w.document.querySelectorAll('#timeSelect option').length===12);
 for(const s of manifest.timeSlices){fill(w,'#timeSelect',s.time);await wait(()=>w.document.getElementById('layerStatus').textContent.endsWith(s.id.slice(0,4)+'-'+s.id.slice(4)));const sample=samples.find(p=>p.timeId===s.id&&p.requestedLatitude===42.5),text=await query(w,{latitude:sample.requestedLatitude,longitude:sample.requestedLongitude,date:s.time.slice(0,10)}),expected=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:3}).format(sample.sstCelsius);log('Rendered/query source mean '+s.id,text.includes(expected+' °C')&&text.includes(s.time)&&text.includes(s.source.originalFile));}
 fill(w,'#timeSelect',manifest.timeSlices[2].time);await wait(()=>w.document.getElementById('layerStatus').textContent.endsWith('2025-03'));
 let text=await query(w,{latitude:42.5,longitude:-70.2,date:'2025-03-01'});log('Missing exact date does not retain a previous temperature',text.includes('Bu tarihte kaynak kaydı yok.')&&!text.includes(' °C'));
 text=await query(w,{latitude:42.5,longitude:-70.2,date:'2025-03-01',mode:'interval-mean'});log('Explicit interval mean reports true representative time',text.includes('2025-03-16T12:00:00Z')&&text.includes('2025-03-01T12:00:00Z'));
 log('A valid source query marks only its original cell',w.document.querySelectorAll('path.leaflet-interactive').length===1);
 fill(w,'.environment-query [name="date"]','2025-03-02');log('Editing date clears the previous value and source marker immediately',!w.document.querySelector('.environment-point-result').textContent&&w.document.querySelectorAll('path.leaflet-interactive').length===0);
 text=await query(w,{latitude:48.85,longitude:2.35,date:'2025-03-01',mode:'interval-mean'});log('Land/missing SST is not replaced by zero',text.includes('Kara / eksik SST')&&!text.includes('0 °C'));
 text=await query(w,{latitude:-30,longitude:150,date:'2025-03-01',mode:'interval-mean'});log('Outside native distribution is explicitly reported',text.includes('özgün çözünürlüklü dağıtım paketinin dışında'));
 for(const variable of ['sst_uncertainty','sea_ice_fraction','mask','sst']){fill(w,'#variableSelect',variable);await wait(()=>w.document.querySelector('.environment-legend strong')?.textContent.startsWith({sst:'Deniz yüzeyi sıcaklığı',sst_uncertainty:'Kaynak hata standart sapması',sea_ice_fraction:'Deniz buzu alan oranı',mask:'Kaynak yüzey maskesi'}[variable])&&w.document.querySelectorAll('.environmental-raster-layer canvas').length>0);log('Layer adapter renders '+variable,w.document.querySelectorAll('.environmental-raster-layer canvas').length>0);}
 for(const [lang,label]of [['en','Environmental point query'],['de','Umwelt-Punktabfrage'],['fr','Requête environnementale ponctuelle'],['es','Consulta ambiental puntual'],['tr','SST nokta sorgusu']]){fill(w,'#languageSelect',lang);await wait(()=>w.document.querySelector('.environment-query h3')?.textContent===label);log('Environmental controls in '+lang,w.document.querySelectorAll('#timeSelect option').length===12);}
 log('Browser never downloads any raw NetCDF',!w.performance.getEntriesByType('resource').some(r=>/\.nc(?:\?|$)/i.test(r.name)));
 document.body.dataset.result='passed';
 }catch(e){const li=document.createElement('li');li.className='fail';li.textContent='ERROR: '+e.stack;results.append(li);document.body.dataset.result='failed';}finally{cleanup();}};
document.getElementById('mobile').onclick=async()=>{try{const area=document.getElementById('responsive');area.replaceChildren();for(const [width,lang]of [[320,'fr'],[390,'de'],[768,'es']]){const f=document.createElement('iframe');f.style.width=width+'px';f.style.flex='0 0 '+width+'px';f.title='SST '+width+' '+lang;area.append(f);const w=await mount(f,lang);log('No horizontal overflow '+width+' '+lang,w.document.documentElement.scrollWidth<=w.document.documentElement.clientWidth);}}catch(e){const li=document.createElement('li');li.className='fail';li.textContent=e.stack;results.append(li);}finally{cleanup();}};
</script></html>
